name: Update news daily

on:
  schedule:
    # 04:00 UTC = 06:00 Europe/Berlin (CEST, UTC+2).
    # Note: during winter (CET, UTC+1) this becomes 05:00 Berlin time,
    # since GitHub Actions cron always runs in UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest news
        run: python3 scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json ongoing_events.json
          git diff --quiet --cached || git commit -m "Update news $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
