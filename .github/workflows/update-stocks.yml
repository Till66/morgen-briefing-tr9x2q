name: Update stocks hourly

on:
  schedule:
    # Every hour, on the hour. Gives the ticker a "live-ish" feel without
    # hammering the free Stooq endpoints.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest stock quotes
        run: python3 scripts/fetch_stocks.py

      - name: Commit updated stocks.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add stocks.json
          git diff --quiet --cached || git commit -m "Update stocks $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
